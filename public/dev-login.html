<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>開發用登入 — CARE</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 16px; font: 16px/1.6 system-ui, sans-serif; background: #f6f6f4; color: #1a1a1a; }
  .warn { background: #fde8e8; border: 1px solid #f0a8a8; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  textarea, input { width: 100%; box-sizing: border-box; font: 14px/1.4 ui-monospace, monospace;
                    padding: 10px; border: 1px solid #c9c9c4; border-radius: 8px; }
  textarea { height: 120px; }
  button { width: 100%; min-height: 48px; margin-top: 12px; font-size: 16px; font-weight: 600;
           border: 0; border-radius: 999px; background: #2f6b1c; color: #fff; }
  button.secondary { background: #e5e5e0; color: #1a1a1a; }
  code { background: #eee; padding: 1px 4px; border-radius: 4px; }
  .state { font: 13px/1.5 ui-monospace, monospace; word-break: break-all; color: #555; }
</style>
</head>
<body>
  <div class="warn">
    <b>開發／實機測試用工具</b>，不從 App 連結。它只是把測試用的登入憑證寫進這個瀏覽器的
    localStorage，方便在手機上測試——手機沒有開發者主控台可以手動寫入。
  </div>

  <div class="card">
    <h2 style="margin-top:0">寫入測試憑證</h2>
    <p>Token 由 <code>scripts/seed_rbac_e2e.py</code> 產生。刻意<b>不從網址參數讀取</b>：
       網址會留在瀏覽紀錄、referrer 與伺服器日誌裡，而 token 本身就是憑證。</p>

    <label for="token">Token（Bearer 後面那一長串）</label>
    <textarea id="token" autocapitalize="off" autocorrect="off" spellcheck="false"
              placeholder="eyJhbGciOiJIUzI1NiIs..."></textarea>

    <label for="uid">使用者 ID</label>
    <input id="uid" value="U_E2E_OWNER" autocapitalize="off" autocorrect="off" spellcheck="false">

    <button id="save" type="button">寫入並前往健康紀錄</button>
    <button id="clear" type="button" class="secondary">清除登入狀態</button>
  </div>

  <div class="card">
    <h2 style="margin-top:0">目前狀態</h2>
    <div class="state" id="state">讀取中…</div>
  </div>

<script>
  var TOKEN_KEY = 'CARE_AUTH_TOKEN';
  var UID_KEY = 'CARE_LINE_USER_ID';
  var LOGGED_OUT_KEY = 'CARE_LOGGED_OUT';

  function $(id) { return document.getElementById(id); }

  function renderState() {
    var token = '';
    var uid = '';
    try {
      token = localStorage.getItem(TOKEN_KEY) || '';
      uid = localStorage.getItem(UID_KEY) || '';
    } catch (e) {
      $('state').textContent = '無法讀取 localStorage：' + e;
      return;
    }
    $('state').textContent = token
      ? 'user: ' + uid + '\ntoken: ' + token.slice(0, 24) + '…（長度 ' + token.length + '）'
      : '未寫入任何憑證。';
  }

  $('save').addEventListener('click', function () {
    var token = $('token').value.trim().replace(/^Bearer\s+/i, '');
    var uid = $('uid').value.trim();
    if (!token || !uid) { alert('Token 與使用者 ID 都要填。'); return; }
    try {
      localStorage.setItem(TOKEN_KEY, token);
      localStorage.setItem(UID_KEY, uid);
      // 使用者若曾在 App 裡登出，這個旗標會擋掉自動登入，一併清掉
      sessionStorage.removeItem(LOGGED_OUT_KEY);
    } catch (e) {
      alert('寫入失敗：' + e);
      return;
    }
    renderState();
    location.href = '/health-records';
  });

  $('clear').addEventListener('click', function () {
    try {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(UID_KEY);
    } catch (e) { /* 忽略：無痕模式等情況 */ }
    renderState();
  });

  renderState();
</script>
</body>
</html>
