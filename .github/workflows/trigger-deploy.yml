# merge 到 main 後，通知 CARE-infra 開始 build + deploy（前後端都會重建）
#
# 型別檢查也放在這個檔案，而且 dispatch 要等它過。原因：npm run build 現在只跑 vite
# （vite 把型別標註直接刪掉、不檢查），型別錯誤不會再讓 CARE-infra 的 docker build 失敗，
# 所以關卡要移到 dispatch 之前，不然錯的程式會直接上正式站。
# PR 也跑，合併前就看得到結果。
name: Trigger Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      # --ignore-scripts：理由同 playwright.yml（避免套件在安裝階段執行任意程式）
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck

  trigger-infra-deploy:
    # 型別沒過就不部署
    needs: typecheck
    # PR 只做檢查，碰不到正式環境
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy to CARE-infra
        # 第三方 action 以完整 commit SHA 固定，tag 可被移動、SHA 不能。
        # 升版時同步更新後面的版號註解。
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          repository: Yanagi-0912/CARE-infra
          event-type: deploy
          client-payload: |
            {
              "source": "frontend",
              "ref": "main",
              "sha": "${{ github.sha }}"
            }
