server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 入口檔案「每次都問」，雜湊檔案「永遠不問」。
  #
  # Vite 會把內容雜湊寫進 /assets/ 的檔名（Medications-B4O3yMDm.js），內容一變
  # 檔名就變；index.html 是整個站唯一名字固定的檔案，裡面記著這一版該載哪些
  # 雜湊檔名。因此這兩類檔案的快取策略必須相反——搞反的代價不對稱：
  # index.html 快取過頭會讓整份 App 原地卡在舊版本（舊入口指向舊 chunk，而那些
  # chunk 也還在快取裡），而 /assets/ 快取不足只是多幾次沒必要的下載。
  location = /index.html {
    # no-cache 不是「不要快取」（那是 no-store），而是「可以存，但每次用之前
    # 都必須向伺服器驗證一次」。沒有這行時 index.html 只有 last-modified，
    # 快取會依 RFC 9111 §4.2.2 的啟發式規則自行猜測新鮮度（常見為距離
    # last-modified 時間的 10%），在猜測期內完全不問伺服器就直接用舊的。
    # 桌面瀏覽器按重新整理可以強制重新驗證，但 LINE 的 LIFF WebView 沒有網址列
    # 也沒有重新整理鍵，使用者沒有任何辦法繞過——只能整個關掉 App 重開。
    # 帶 ETag 的驗證請求命中時回 304，成本只有幾十 bytes。
    add_header Cache-Control "no-cache";
  }

  # ^~ 讓這個前綴勝過下面的副檔名 regex location，否則 /assets/*.js 會被
  # regex 接走，這裡的 Cache-Control 就套不上（nginx 的 location 優先序：
  # 精確比對 > ^~ 前綴 > regex > 一般前綴）。
  location ^~ /assets/ {
    # 檔名帶內容雜湊，內容變檔名就變，因此不可能取到過期的版本，可以放心讓
    # 瀏覽器長期保留且不必重新驗證。immutable 讓瀏覽器連使用者主動重新整理時
    # 都跳過驗證請求。
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 靜態資產找不到就回 404，不得掉進下面的 SPA fallback。
  #
  # fallback 存在的理由是前端路由：/medications 在硬碟上沒有對應檔案，必須回
  # index.html 讓 React Router 接手。但它對所有路徑一視同仁，於是「檔案不存在」
  # 也會拿到一份 200 的 HTML——那是在對快取層謊稱請求成功。實際造成過兩種故障：
  #
  #   1. 舊的 chunk 在部署後被刪除，瀏覽器要 .js 卻拿到 HTML，當成 JavaScript
  #      解析後語法錯誤，動態載入失敗（症狀是整頁空白）。
  #   2. /drug-appearance/*.jpg 因 Ingress 少一條路由而落到這裡，200 的 HTML 被
  #      Cloudflare 依副檔名判定為可快取的圖片存了四小時，且各邊緣節點狀態不一，
  #      症狀是「有些人看得到圖、有些人看不到」，而且改源站也無法立刻生效。
  #
  # 回 404 就沒有這個問題：快取不會長期保存 404，瀏覽器也知道該放棄。
  location ~* \.(js|mjs|css|map|json|txt|xml|ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|otf|eot|mp4|webm|wasm)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
